{{- define "externalSecret" -}}
apiVersion: {{ .apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .chartName }}
    app.kubernetes.io/instance: {{ .releaseName }}
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    name: {{ .secretStoreName | quote }}
    kind: {{ .secretStoreKind | quote }}
  target:
    name: {{ .targetName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: {{ .remoteProperty | quote }}
{{- end -}}

{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.apiVersion }}{{ fail "externalSecrets.apiVersion must be set (must match the installed External Secrets Operator CRD apiVersion for ExternalSecret, e.g. external-secrets.io/v1alpha1 or external-secrets.io/v1beta1)" }}{{- end }}
{{- $apiVersion := .Values.externalSecrets.apiVersion -}}

{{ include "externalSecret" (dict
  "apiVersion" $apiVersion
  "name" (printf "%s-database" .Release.Name)
  "chartName" .Chart.Name
  "releaseName" .Release.Name
  "refreshInterval" .Values.externalSecrets.refreshInterval
  "secretStoreName" .Values.externalSecrets.secretStoreRef.name
  "secretStoreKind" .Values.externalSecrets.secretStoreRef.kind
  "targetName" .Values.app.database.secretName
  "secretKey" .Values.app.database.secretKey
  "remoteKey" .Values.externalSecrets.database.remoteRef.key
  "remoteProperty" .Values.externalSecrets.database.remoteRef.property
) }}
---
{{ include "externalSecret" (dict
  "apiVersion" $apiVersion
  "name" (printf "%s-postgres" .Release.Name)
  "chartName" .Chart.Name
  "releaseName" .Release.Name
  "refreshInterval" .Values.externalSecrets.refreshInterval
  "secretStoreName" .Values.externalSecrets.secretStoreRef.name
  "secretStoreKind" .Values.externalSecrets.secretStoreRef.kind
  "targetName" .Values.postgres.auth.passwordSecretName
  "secretKey" .Values.postgres.auth.passwordSecretKey
  "remoteKey" .Values.externalSecrets.postgresPassword.remoteRef.key
  "remoteProperty" .Values.externalSecrets.postgresPassword.remoteRef.property
) }}
{{- end }}
