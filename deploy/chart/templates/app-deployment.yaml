apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.app.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.database.secretName }}
                  key: {{ .Values.app.database.secretKey }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ .Values.app.auth.issuerUrl | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ printf "http://%s-keycloak:%d/realms/%s/protocol/openid-connect/certs" .Release.Name (int .Values.service.keycloak.port) .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_AUTHORIZE_URL
              value: {{ .Values.app.auth.authorizeUrl | quote }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ .Values.app.auth.tokenUrl | quote }}
            - name: KEYCLOAK_LOGOUT_URL
              value: {{ .Values.app.auth.logoutUrl | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.app.auth.clientId | quote }}
            - name: AUTH_REDIRECT_URI
              value: {{ .Values.app.auth.redirectUri | quote }}
            - name: AUTH_POST_LOGOUT_REDIRECT_URI
              value: {{ .Values.app.auth.postLogoutRedirectUri | quote }}
            - name: AUTH_SCOPE
              value: {{ .Values.app.auth.scope | quote }}
            - name: APP_BASE_URL
              value: {{ .Values.app.publicUrl | quote }}
            - name: DAILY_REMINDER_EMAIL_SEND_URL
              value: {{ .Values.app.reminders.sendUrl | quote }}
            - name: DAILY_REMINDER_EMAIL_FROM
              value: {{ .Values.app.reminders.from | quote }}
            - name: DAILY_REMINDER_EMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.reminders.secretName | quote }}
                  key: {{ .Values.app.reminders.secretKey | quote }}
                  optional: true
            - name: DAILY_REMINDER_RUN_AT
              value: {{ .Values.app.reminders.runAtUtc | quote }}
            - name: DAILY_REMINDER_LOOKAHEAD_DAYS
              value: {{ .Values.app.reminders.lookaheadDays | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
