{{- if and .Values.secrets.create .Values.secrets.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.database.secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.app.database.secretKey }}: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
{{- if and .Values.secrets.create .Values.secrets.postgresPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.auth.passwordSecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordSecretKey }}: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
{{- if or .Values.secrets.keycloakPostgresPassword .Values.secrets.keycloakAdminPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.database.passwordSecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.keycloak.database.passwordSecretKey }}: {{ .Values.secrets.keycloakPostgresPassword | quote }}
  {{ .Values.keycloak.auth.passwordSecretKey }}: {{ .Values.secrets.keycloakAdminPassword | quote }}
{{- end }}
{{- if .Values.smtp.createSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-email
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  smtp-host: {{ .Values.smtp.host | quote }}
  smtp-port: {{ .Values.smtp.port | default "587" | quote }}
  smtp-user: {{ .Values.smtp.user | quote }}
  smtp-pass: {{ .Values.smtp.pass | quote }}
{{- end }}
