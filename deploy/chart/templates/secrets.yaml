# Plain Kubernetes Secrets are created only when external secrets are disabled.
# When externalSecrets.enabled is true, the ExternalSecret resources in
# external-secrets.yaml populate these secrets from the external secrets store.
{{- if and (not .Values.externalSecrets.enabled) .Values.secrets.create .Values.secrets.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.database.secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.app.database.secretKey }}: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
{{- if and (not .Values.externalSecrets.enabled) .Values.secrets.create .Values.secrets.postgresPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.auth.passwordSecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordSecretKey }}: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
{{- if and (not .Values.externalSecrets.enabled) (or .Values.secrets.keycloakPostgresPassword .Values.secrets.keycloakAdminPassword) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.database.passwordSecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.keycloak.database.passwordSecretKey }}: {{ .Values.secrets.keycloakPostgresPassword | quote }}
  {{ .Values.keycloak.auth.passwordSecretKey }}: {{ .Values.secrets.keycloakAdminPassword | quote }}
{{- end }}
