{{- if and .Values.secrets.create .Values.secrets.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.database.secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.app.database.secretKey }}: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
{{- if and .Values.secrets.create .Values.secrets.postgresPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.auth.passwordSecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordSecretKey }}: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
