replicaCount: 1

image:
  app:
    repository: ghcr.io/robinvdveer/metrics-server
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  keycloak:
    repository: quay.io/keycloak/keycloak
    tag: 25.0.6
    pullPolicy: IfNotPresent

service:
  app:
    type: ClusterIP
    port: 80
    targetPort: 3000
  postgres:
    type: ClusterIP
    port: 5432
  keycloak:
    type: ClusterIP
    port: 8080
  keycloakPostgres:
    type: ClusterIP
    port: 5432

app:
  port: 3000
  nodeEnv: production
  publicUrl: http://app.metrics-server.local
  database:
    secretName: metrics-server-database
    secretKey: database-url
  auth:
    clientId: todo-app
    issuerUrl: http://keycloak.metrics-server.local/realms/todos
    authorizeUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/auth
    tokenUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/token
    logoutUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/logout
    redirectUri: http://app.metrics-server.local/auth/callback
    postLogoutRedirectUri: http://app.metrics-server.local/login
    scope: openid profile email

secrets:
  create: false
  databaseUrl: ""
  postgresPassword: ""
  keycloakPostgresPassword: ""
  keycloakAdminPassword: ""

externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1alpha1
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  database:
    remoteRef:
      key: metrics-server/database
      property: database-url
  postgresPassword:
    remoteRef:
      key: metrics-server/postgres
      property: postgres-password
  keycloakPostgresPassword:
    remoteRef:
      key: metrics-server/keycloak-postgres
      property: postgres-password
  keycloakAdminPassword:
    remoteRef:
      key: metrics-server/keycloak
      property: admin-password

postgres:
  enabled: true
  auth:
    username: todouser
    database: tododb
    passwordSecretName: metrics-server-postgres
    passwordSecretKey: postgres-password
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

keycloak:
  enabled: true
  realm: todos
  clientId: todo-app
  publicUrl: http://keycloak.metrics-server.local
  hostname: keycloak.metrics-server.local
  auth:
    username: admin
    passwordSecretName: metrics-server-keycloak
    passwordSecretKey: admin-password
  ingress:
    enabled: false
    className: ""
    host: keycloak.metrics-server.local
    annotations: {}
    tls: []
  database:
    username: keycloak
    database: keycloak
    passwordSecretName: metrics-server-keycloak
    passwordSecretKey: postgres-password
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.metrics-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
