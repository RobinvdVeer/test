replicaCount: 1

image:
  app:
    repository: ghcr.io/robinvdveer/metrics-server
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  keycloak:
    repository: quay.io/keycloak/keycloak
    tag: 25.0.6
    pullPolicy: IfNotPresent

service:
  app:
    type: ClusterIP
    port: 80
    targetPort: 3000
  postgres:
    type: ClusterIP
    port: 5432
  keycloak:
    type: ClusterIP
    port: 8080
  keycloakPostgres:
    type: ClusterIP
    port: 5432

app:
  port: 3000
  nodeEnv: production
  publicUrl: http://localhost:3000
  database:
    secretName: metrics-server-database
    secretKey: database-url
  auth:
    clientId: todo-app
    issuerUrl: http://localhost:8081/realms/todos
    authorizeUrl: http://localhost:8081/realms/todos/protocol/openid-connect/auth
    tokenUrl: http://localhost:8081/realms/todos/protocol/openid-connect/token
    logoutUrl: http://localhost:8081/realms/todos/protocol/openid-connect/logout
    redirectUri: http://localhost:3000/auth/callback
    postLogoutRedirectUri: http://localhost:3000/login
    scope: openid profile email

secrets:
  create: false
  databaseUrl: ""
  postgresPassword: ""
  keycloakPostgresPassword: ""
  keycloakAdminPassword: ""

externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  database:
    remoteRef:
      key: metrics-server/database
      property: database-url
  postgresPassword:
    remoteRef:
      key: metrics-server/postgres
      property: postgres-password
  keycloakPostgresPassword:
    remoteRef:
      key: metrics-server/keycloak-postgres
      property: postgres-password
  keycloakAdminPassword:
    remoteRef:
      key: metrics-server/keycloak
      property: admin-password

postgres:
  enabled: true
  auth:
    username: todouser
    database: tododb
    passwordSecretName: metrics-server-postgres
    passwordSecretKey: postgres-password
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

keycloak:
  enabled: true
  realm: todos
  clientId: todo-app
  publicUrl: http://localhost:8081
  hostname: localhost
  auth:
    username: admin
    passwordSecretName: metrics-server-keycloak
    passwordSecretKey: admin-password
  ingress:
    enabled: false
    className: ""
    host: localhost
    annotations: {}
    tls: []
  database:
    username: keycloak
    database: keycloak
    passwordSecretName: metrics-server-keycloak
    passwordSecretKey: postgres-password
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Pod and container securityContext for the app Deployment.
# All keys are optional when overriding in a per-env values file; any key you
# omit falls back to the default below. Values must be numeric where shown
# (the kubelet cannot verify a non-numeric user against runAsNonRoot: true).
# The defaults match the `node` user (UID/GID 1000) in node:18-alpine, which
# is the base image of ghcr.io/robinvdveer/metrics-server. See deploy/README.md
# for details.
securityContext:
  # runAsNonRoot (container): refuse to start if the resolved UID is 0.
  runAsNonRoot: true
  # runAsUser (container): numeric UID the container runs as.
  runAsUser: 1000
  # runAsGroup (container): numeric GID the container runs as.
  runAsGroup: 1000
  # fsGroup (pod): supplemental GID applied to mounted volumes.
  fsGroup: 1000
  # allowPrivilegeEscalation (container): blocks setuid/setgid escalation.
  allowPrivilegeEscalation: false

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
