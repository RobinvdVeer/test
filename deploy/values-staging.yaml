image:
  app:
    repository: ghcr.io/robinvdveer/metrics-server
    tag: latest

replicaCount: 1

app:
  publicUrl: http://app.metrics-server.local
  auth:
    issuerUrl: http://keycloak.metrics-server.local/realms/todos
    authorizeUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/auth
    tokenUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/token
    logoutUrl: http://keycloak.metrics-server.local/realms/todos/protocol/openid-connect/logout
    redirectUri: http://app.metrics-server.local/auth/callback
    postLogoutRedirectUri: http://app.metrics-server.local/login

keycloak:
  publicUrl: http://keycloak.metrics-server.local
  hostname: keycloak.metrics-server.local
  ingress:
    enabled: true
    host: keycloak.metrics-server.local
    className: ""
    annotations: {}
    tls: []

ingress:
  enabled: false

externalSecrets:
  enabled: true
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  database:
    remoteRef:
      key: metrics-server/staging/database
      property: database-url
  postgresPassword:
    remoteRef:
      key: metrics-server/staging/postgres
      property: postgres-password
  keycloakPostgresPassword:
    remoteRef:
      key: metrics-server/staging/keycloak-postgres
      property: postgres-password
  keycloakAdminPassword:
    remoteRef:
      key: metrics-server/staging/keycloak
      property: admin-password
  emailHost:
    remoteRef:
      key: metrics-server/staging/email
      property: smtp-host
  emailPort:
    remoteRef:
      key: metrics-server/staging/email
      property: smtp-port
  emailUser:
    remoteRef:
      key: metrics-server/staging/email
      property: smtp-user
  emailPass:
    remoteRef:
      key: metrics-server/staging/email
      property: smtp-pass

todo:
  dueAlertDays: 2
  defaultFrequencyHours: 24

smtp:
  createSecrets: false
  host: smtp.gmail.com
  port: 587
  user: your-email@gmail.com
  pass: app-password
  secure: false
  fromEmail: noreply@metrics-server.local
  emailCheckInterval: 3600000 # 1 hour in milliseconds

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
