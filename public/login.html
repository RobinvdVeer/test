<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      body { font-family: system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; margin: 0; }
      main { text-align: center; padding: 24px; max-width: 360px; }
      button { padding: 10px 16px; font: inherit; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p class="muted">Use your Keycloak account to continue.</p>
      <button id="login">Login</button>
      <p id="error" class="muted"></p>
    </main>
    <script type="module" src="/assets/login.js"></script>
  </body>
</html>
