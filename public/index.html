<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      /* ── Design tokens (linear-inspired, washed-out palette) ───────────── */
      :root {
        --bg:          #f5f5f5;
        --surface:     #ffffff;
        --border:      #e4e4e7;
        --border-focus:#a1a1aa;
        --text:        #18181b;
        --text-mid:    #52525b;
        --text-muted:  #71717a;
        --text-faint:  #a1a1aa;
        --accent:      #7c3aed;
        --accent-hover:#6d28d9;
        --accent-bg:   #ede9fe;
        --accent-text: #5b21b6;
        --success:     #059669;
        --success-bg:  #d1fae5;
        --success-text:#065f46;
        --warning:     #d97706;
        --warning-bg:  #fef3c7;
        --warning-text:#92400e;
        --info:        #2563eb;
        --info-bg:     #dbeafe;
        --info-text:   #1e40af;
        --danger:      #dc2626;
        --danger-bg:   #fee2e2;
        --danger-text: #991b1b;
        --radius-sm:   6px;
        --radius-md:   8px;
        --radius-lg:   12px;
        --shadow-sm:   0 1px 2px rgba(0,0,0,.04);
        --shadow-md:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
        --shadow-lg:   0 4px 12px rgba(0,0,0,.07);
        --transition:  150ms ease;
        --font-sans:   'Inter', system-ui, -apple-system, sans-serif;

      }

      /* ── Reset & base ──────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--text);
      }

      body { min-height: 100vh; }

      /* ── Layout shell ──────────────────────────────────────────────── */
      .app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Header bar ────────────────────────────────────────────────── */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }

      .app-header__brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
      }

      .app-header__title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
        line-height: 1.2;
      }

      .app-header__subtitle {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.2;
      }

      .app-header__actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ── Logout button variant ─────────────────────────────────────── */
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-mid);
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background var(--transition), color var(--transition), border-color var(--transition);
      }

      .btn-ghost:hover {
        background: var(--bg);
        color: var(--text);
      }

      /* ── Main content ──────────────────────────────────────────────── */
      .app-main {
        flex: 1;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 24px 48px;
      }

      /* ── Status bar (toast-like) ───────────────────────────────────── */
      .status-bar {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.4;
        opacity: 0;
        transform: translateY(-4px);
        animation: statusIn 200ms ease forwards;
        transition: opacity 200ms ease, transform 200ms ease, background var(--transition), color var(--transition);
      }

      .status-bar:empty { display: none; }

      .status-bar.success  { background: var(--success-bg); color: var(--success-text); border: 1px solid transparent; }
      .status-bar.error    { background: var(--danger-bg);  color: var(--danger-text);  border: 1px solid transparent; }
      .status-bar.warning  { background: var(--warning-bg); color: var(--warning-text); border: 1px solid transparent; }
      .status-bar.info     { background: var(--info-bg);    color: var(--info-text);    border: 1px solid transparent; }

      @keyframes statusIn {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes statusOut {
        to { opacity: 0; transform: translateY(-4px); }
      }

      /* ── Toolbar ───────────────────────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .toolbar__search {
        flex: 1;
        min-width: 180px;
        max-width: 320px;
      }

      /* ── Todo form (collapsible) ───────────────────────────────────── */
      .form-container {
        margin-bottom: 24px;
      }

      .todo-form {
        display: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-md);
        margin-bottom: 16px;
        animation: formSlideIn 200ms ease;
      }

      .todo-form.visible { display: block; }

      @keyframes formSlideIn {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .form-grid .field--full {
        grid-column: 1 / -1;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      /* ── Form fields ───────────────────────────────────────────────── */
      .field label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.02em;
      }

      input[type="text"],
      input[type="search"],
      input[type="email"],
      textarea,
      select {
        display: block;
        width: 100%;
        padding: 8px 12px;
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
        box-shadow: inset 0 1px 2px rgba(0,0,0,.02);
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-bg);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--text-faint);
      }

      textarea {
        resize: vertical;
        min-height: 72px;
      }

      /* ── Buttons ───────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
        white-space: nowrap;
        line-height: 1.4;
      }

      .btn:active { transform: scale(0.97); }

      .btn--primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }
      .btn--primary:hover {
        background: var(--accent-hover);
        box-shadow: var(--shadow-md);
      }

      .btn--secondary {
        background: var(--surface);
        color: var(--text-mid);
        border-color: var(--border);
      }
      .btn--secondary:hover {
        background: var(--bg);
        border-color: var(--border-focus);
      }

      .btn--danger {
        background: transparent;
        color: var(--danger-text);
        border-color: transparent;
      }
      .btn--danger:hover {
        background: var(--danger-bg);
      }



      /* ── Divider ───────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--border);
        margin: 0 0 16px;
      }

      /* ── Todo list ─────────────────────────────────────────────────── */
      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── Todo item card ────────────────────────────────────────────── */
      .todo-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition), opacity var(--transition);
      }

      .todo-item:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--border-focus);
      }

      .todo-item.completed {
        opacity: 0.55;
      }

      .todo-item.completed .todo-title {
        text-decoration: line-through;
        color: var(--text-faint);
      }

      .todo-item[data-loading="true"] {
        opacity: 0.5;
        pointer-events: none;
      }

      /* ── Status accent bar on left of card ─────────────────────────── */
      .todo-item--pending     { border-left: 3px solid var(--text-faint); }
      .todo-item--in_progress { border-left: 3px solid var(--info); }
      .todo-item--completed   { border-left: 3px solid var(--success); }

      .todo-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.4;
        word-break: break-word;
      }

      .todo-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.4;
      }

      /* ── Badge / pill ──────────────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 8px;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.6;
        border-radius: 999px;
        text-transform: capitalize;
      }

      .badge--pending      { background: var(--bg); color: var(--text-muted); }
      .badge--in_progress  { background: var(--info-bg); color: var(--info-text); }
      .badge--completed    { background: var(--success-bg); color: var(--success-text); }
      .badge--priority-low      { background: var(--bg); color: var(--text-faint); }
      .badge--priority-medium   { background: var(--warning-bg); color: var(--warning-text); }
      .badge--priority-high     { background: var(--danger-bg); color: var(--danger-text); }
      .badge--category      { background: var(--accent-bg); color: var(--accent-text); }

      .todo-description {
        font-size: 13px;
        color: var(--text-mid);
        line-height: 1.5;
        word-break: break-word;
      }

      /* ── Empty state ───────────────────────────────────────────────── */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
        color: var(--text-faint);
        font-size: 14px;
        gap: 8px;
      }

      .empty-state__icon {
        font-size: 32px;
        margin-bottom: 4px;
      }

      /* ── Responsive ────────────────────────────────────────────────── */
      @media (max-width: 640px) {
        .app-header { padding: 0 16px; }
        .app-main { padding: 16px 16px 32px; }
        .form-grid { grid-template-columns: 1fr; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .toolbar__search { max-width: 100%; }
        .btn--primary { width: 100%; justify-content: center; }
        .form-actions { flex-direction: column-reverse; }
        .form-actions .btn { width: 100%; justify-content: center; }
      }

    </style>
  </head>
  <body>
    <div class="app-shell">

      <!-- ─── Header bar ──────────────────────────────────────────────── -->
      <header class="app-header">
        <div class="app-header__brand">
          <span class="app-header__title">Todos</span>
          <span class="app-header__subtitle">Your personal todo list</span>
        </div>
        <div class="app-header__actions">
          <button class="btn-ghost" id="logout">Logout</button>
        </div>
      </header>

      <!-- ─── Main content ────────────────────────────────────────────── -->
      <main class="app-main">

        <!-- Status bar -->
        <section id="status" class="status-bar" role="status" aria-live="polite"></section>

        <div class="divider"></div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar__search">
            <input type="text" id="search" placeholder="Search todos…" />
          </div>
          <button class="btn btn--primary" id="btn-add">
            <span aria-hidden="true">+</span> New todo
          </button>
        </div>

        <!-- Todo creation form (collapsible) -->
        <div class="form-container">
          <form id="todo-form" class="todo-form" autocomplete="off">
            <div class="form-grid">
              <div class="field field--full">
                <label for="title">Title</label>
                <input id="title" name="title" placeholder="What needs to be done?" required />
              </div>
              <div class="field field--full">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Add some details…"></textarea>
              </div>
              <div class="field">
                <label for="category">Category</label>
                <input id="category" name="category" placeholder="e.g. work" />
              </div>
              <div class="field">
                <label for="status-input">Status</label>
                <select id="status-input" name="status">
                  <option value="" disabled selected>Select</option>
                  <option value="pending">Pending</option>
                  <option value="in_progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>
              <div class="field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                  <option value="" disabled selected>Select</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn--secondary" id="btn-cancel">Cancel</button>
              <button type="submit" class="btn btn--primary">Create todo</button>
            </div>
          </form>
        </div>

        <!-- Todo list -->
        <ul id="todos" class="todo-list"></ul>

      </main>
    </div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
