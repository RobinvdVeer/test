# Local development compose file only. Do not use for staging/production.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: ${TODO_POSTGRES_PASSWORD:?Set TODO_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tododb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d tododb"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak_postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set KEYCLOAK_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: todo_keycloak
    command: start-dev --import-realm --hostname=http://localhost:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set KEYCLOAK_POSTGRES_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  app:
    build: .
    container_name: todo_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://todouser:${TODO_POSTGRES_PASSWORD:?Set TODO_POSTGRES_PASSWORD in .env}@postgres:5432/tododb
      NODE_ENV: development
      AUTH_ISSUER: http://localhost:8080/realms/local-dev
      PUBLIC_AUTH_ISSUER: http://localhost:8080/realms/local-dev
      AUTH_JWKS_URI: http://keycloak:8080/realms/local-dev/protocol/openid-connect/certs
      AUTH_CLIENT_ID: todo-app
      AUTH_AUDIENCE: todo-app
      AUTH_REQUIRED_ROLE: user
      AUTH_ROLE_SOURCE: realm
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  keycloak_postgres_data:
